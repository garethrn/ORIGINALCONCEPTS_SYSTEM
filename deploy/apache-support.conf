# Host Apache snippet for this app only.
# Enable proxy modules if they are not already enabled:
#   sudo a2enmod proxy proxy_http headers
# Install a certificate for this hostname only:
#   sudo certbot --apache -d support.originalconcepts.co.za
# Do not change the virtual hosts of the other sites on this server.

<VirtualHost *:80>
    ServerName support.originalconcepts.co.za

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:8085/
    ProxyPassReverse / http://127.0.0.1:8085/
    LimitRequestBody 12582912
</VirtualHost>
