# Host nginx snippet for this app only.
# Add this as its own site. Do not replace the server blocks of other sites.
# Install a certificate for this hostname only:
#   sudo certbot --nginx -d support.originalconcepts.co.za

server {
    listen 80;
    listen [::]:80;
    server_name support.originalconcepts.co.za;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 12m;
    }
}
